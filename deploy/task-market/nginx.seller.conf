limit_req_zone $binary_remote_addr zone=jarvis_paid_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=jarvis_conn_per_ip:10m;
limit_conn_zone $server_name zone=jarvis_conn_total:10m;
log_format jarvis_safe '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name "";

    ssl_certificate /run/secrets/seller_tls_certificate;
    ssl_certificate_key /run/secrets/seller_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    return 444;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name __TASK_MARKET_PUBLIC_HOSTNAME__;

    ssl_certificate /run/secrets/seller_tls_certificate;
    ssl_certificate_key /run/secrets/seller_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    access_log /dev/stdout jarvis_safe;
    error_log /dev/stderr warn;
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 15s;
    reset_timedout_connection on;

    limit_conn jarvis_conn_per_ip 4;
    limit_conn jarvis_conn_total 32;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /v1/edge-validation {
        limit_except POST { deny all; }
        limit_req zone=jarvis_paid_per_ip burst=5 nodelay;
        proxy_pass http://172.30.0.3:4021;
        proxy_http_version 1.1;
        proxy_set_header Host __TASK_MARKET_PUBLIC_HOSTNAME__;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
        proxy_buffering on;
    }

    location = /mcp {
        limit_except POST { deny all; }
        limit_req zone=jarvis_paid_per_ip burst=5 nodelay;
        proxy_pass http://172.30.0.3:4021;
        proxy_http_version 1.1;
        proxy_set_header Host __TASK_MARKET_PUBLIC_HOSTNAME__;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
        proxy_buffering on;
    }

    location = /.well-known/task-market.json {
        limit_except GET { deny all; }
        limit_req zone=jarvis_paid_per_ip burst=5 nodelay;
        proxy_pass http://172.30.0.3:4021;
        proxy_http_version 1.1;
        proxy_set_header Host __TASK_MARKET_PUBLIC_HOSTNAME__;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_buffering on;
    }

    location / {
        return 404;
    }
}
